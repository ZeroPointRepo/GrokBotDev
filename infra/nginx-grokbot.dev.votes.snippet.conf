# AUTHOR-ONLY production nginx snippet for the votes-api (:4391): P1 upvotes + /submit/.
# Operator applies after review on crhq-products, alongside Postgres + votes-api env/secrets.
# APPLIED 2026-09-05 as /etc/nginx/conf.d/grokbot-votes-ratelimit.conf (zones) +
# the /api/v1/* locations inside /etc/nginx/sites-enabled/grokbot.dev.

# Place in nginx http{} context (e.g. conf.d) once:
limit_req_zone $binary_remote_addr zone=grokbot_votes_identity:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=grokbot_votes_casts:10m rate=30r/m;
# Submitting a bot is a rare act, so this zone is deliberately the tightest of the three. It is
# the FIRST of two copies of the same limit - the service applies its own per-IP window as well
# (rate/limiter.ts `submissionIp`), because nginx counts raw IPs and the service counts peppered
# hashes, and only one of those survives a config reload.
limit_req_zone $binary_remote_addr zone=grokbot_submissions:10m rate=5r/m;

# Place inside the grokbot.dev server{} before the generic .json and / locations.
# The static JSON API keeps serving via the existing \.json location; only these exact dynamic
# vote endpoints proxy to the same-origin votes API.
location = /api/v1/identity {
    include /etc/nginx/snippets/grokbot-security-headers.conf;
    limit_req zone=grokbot_votes_identity burst=3 nodelay;
    proxy_pass http://127.0.0.1:4391;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /api/v1/votes {
    include /etc/nginx/snippets/grokbot-security-headers.conf;
    limit_req zone=grokbot_votes_casts burst=30 nodelay;
    proxy_pass http://127.0.0.1:4391;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /api/v1/votes/ {
    include /etc/nginx/snippets/grokbot-security-headers.conf;
    proxy_pass http://127.0.0.1:4391;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /api/v1/health {
    include /etc/nginx/snippets/grokbot-security-headers.conf;
    proxy_pass http://127.0.0.1:4391;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# The public /submit/ form. Same shape as the vote endpoints: exact-match location, security
# headers re-included (nginx add_header does not inherit into a location that sets its own),
# same-origin proxy to the votes API. `burst=3 nodelay` lets a person who mistypes a link retry
# immediately and still stops a flood.
location = /api/v1/submissions {
    include /etc/nginx/snippets/grokbot-security-headers.conf;
    limit_req zone=grokbot_submissions burst=3 nodelay;
    proxy_pass http://127.0.0.1:4391;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The handler fetches the share page and Turnstile before answering; the service's own
    # budget is 12s, so nginx must not give up first.
    proxy_read_timeout 20s;
}
